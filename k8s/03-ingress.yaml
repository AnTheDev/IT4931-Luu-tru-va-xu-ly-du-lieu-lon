apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bigdata-ingress
  namespace: bigdata
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1024m"
    nginx.ingress.kubernetes.io/client-max-body-size: "1024m"
spec:
  ingressClassName: nginx
  rules:
    - host: it4931.xyz
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: serving-layer
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: metabase
                port:
                  number: 80
    - host: io.it4931.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9001
    - host: s3.it4931.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9000
