# ============================================================================
# METABASE - BI / dashboard. Kết nối trực tiếp MongoDB BIGDATA
# (driver MongoDB tích hợp sẵn) hoặc gọi các endpoint /api/raw/* của serving.
# Metabase tự lưu metadata trong H2 trên PVC (đủ cho đồ án).
# ============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: metabase-data
  namespace: bigdata
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: do-block-storage
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metabase
  namespace: bigdata
  labels:
    app: metabase
    layer: serving
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metabase
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: metabase
        layer: serving
    spec:
      containers:
        - name: metabase
          image: metabase/metabase:v0.62.1
          ports:
            - containerPort: 3000
          env:
            - name: MB_DB_TYPE
              value: "h2"
            - name: MB_DB_FILE
              value: "/metabase-data/metabase.db"
          resources:
            requests:
              cpu: "300m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          volumeMounts:
            - name: metabase-data
              mountPath: /metabase-data
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 15
      volumes:
        - name: metabase-data
          persistentVolumeClaim:
            claimName: metabase-data
---
apiVersion: v1
kind: Service
metadata:
  name: metabase
  namespace: bigdata
  labels:
    app: metabase
spec:
  type: ClusterIP
  selector:
    app: metabase
  ports:
    - name: http
      port: 80
      targetPort: 3000
