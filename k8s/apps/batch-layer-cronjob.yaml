# ============================================================================
# BATCH LAYER (chính) - đọc MinIO s3a://datalake/tmdb.csv,
# tính toàn bộ analytics nâng cao -> MongoDB batch_* views.
# Chạy định kỳ mỗi 6 giờ.
# ============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: batch-layer
  namespace: bigdata
  labels:
    app: batch-layer
    layer: batch
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid          # không chồng job
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: batch-layer
            layer: batch
        spec:
          restartPolicy: Never
          containers:
            - name: batch-layer
              image: bigdata-lambda:latest
              command: ["python", "enhanced_batch_layer.py"]
              envFrom:
                - configMapRef:
                    name: bigdata-config
                - secretRef:
                    name: bigdata-secrets
              resources:
                requests:
                  cpu: "1"
                  memory: "2.5Gi"
                limits:
                  cpu: "2"
                  memory: "4Gi"
