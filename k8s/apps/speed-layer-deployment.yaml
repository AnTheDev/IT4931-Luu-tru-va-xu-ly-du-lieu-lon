# ============================================================================
# SPEED LAYER - Spark Structured Streaming: Kafka -> MongoDB (speed_* views)
# Chạy liên tục. Checkpoint lưu trên PVC để recover khi pod restart.
# ============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: speed-checkpoint
  namespace: bigdata
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: do-block-storage
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: speed-layer
  namespace: bigdata
  labels:
    app: speed-layer
    layer: speed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: speed-layer
  strategy:
    type: Recreate          # streaming + checkpoint RWO: không chạy 2 pod song song
  template:
    metadata:
      labels:
        app: speed-layer
        layer: speed
    spec:
      containers:
        - name: speed-layer
          image: bigdata-lambda:latest
          command: ["python", "enhanced_speed_layer.py"]
          envFrom:
            - configMapRef:
                name: bigdata-config
            - secretRef:
                name: bigdata-secrets
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: checkpoint
              mountPath: /tmp/checkpoint
      volumes:
        - name: checkpoint
          persistentVolumeClaim:
            claimName: speed-checkpoint
