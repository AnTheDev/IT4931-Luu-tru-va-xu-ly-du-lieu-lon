apiVersion: v1
kind: Secret
metadata:
  name: bigdata-secrets
  namespace: bigdata
type: Opaque
stringData:
  # TMDB API token (lấy tại https://www.themoviedb.org/settings/api)
  TMDB_BEARER_TOKEN: "eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiI2YWUzOGE2YmRkZWUyY2RkNWMyOWY2MGU2MjYxOGZkNyIsIm5iZiI6MTc4MTA3Mjc5NS4xMDcsInN1YiI6IjZhMjkwMzliMGI1ZWU0ZGQ5ZWFhZWIyZiIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ._-qzD85jD3Ugd8QQ2BIbTG1_8PtfWr1eDOA9NVzMHH4"

  # MongoDB connection string (user/pass phải trùng mongodb-secret)
  CONNECTION_STRING: "mongodb://root:ChangeMe-Mongo-Pass@mongodb.bigdata.svc.cluster.local:27017/?authSource=admin"

  # MinIO credentials (trùng với minio-secret)
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "ChangeMe-Minio-Pass"
---
# Credentials riêng cho StatefulSet MongoDB
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: bigdata
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: "root"
  MONGO_INITDB_ROOT_PASSWORD: "ChangeMe-Mongo-Pass"
---
# Credentials riêng cho StatefulSet MinIO
apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  namespace: bigdata
type: Opaque
stringData:
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "ChangeMe-Minio-Pass"
