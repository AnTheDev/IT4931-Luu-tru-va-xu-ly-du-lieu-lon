# ============================================================================
# Kustomize gom toàn bộ workload (TRỪ Kafka - apply riêng sau khi cài Strimzi).
#
# Đổi image 1 chỗ duy nhất tại block `images` bên dưới:
#   registry.digitalocean.com/<TÊN_REGISTRY>/bigdata-lambda
#
# Apply:  kubectl apply -k k8s/
# ============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bigdata

resources:
  - 00-namespace.yaml
  - 01-configmap.yaml
  - 02-secret.yaml
  - storage/mongodb.yaml
  - storage/minio.yaml
  - storage/elasticsearch.yaml
  - apps/ingestion-deployment.yaml
  - apps/speed-layer-deployment.yaml
  - apps/serving-layer.yaml
  - apps/batch-layer-cronjob.yaml
  - apps/movie-batch-cronjob.yaml
  - apps/actor-batch-cronjob.yaml
  - apps/metabase.yaml
  - 03-ingress.yaml

# 👇 ĐỔI newName thành registry DOCR của bạn trước khi apply
images:
  - name: bigdata-lambda
    newName: registry.digitalocean.com/my-bigdata-registry/bigdata-lambda
    newTag: latest
