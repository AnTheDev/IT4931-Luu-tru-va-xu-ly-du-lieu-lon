# ============================================================================
# Apache Kafka qua Strimzi Operator (KRaft mode, không cần Zookeeper).
# Yêu cầu: đã cài Strimzi Cluster Operator trước (xem DEPLOY.md).
#
# Tên cluster = "kafka-cluster"  -> bootstrap service tự sinh:
#   kafka-cluster-kafka-bootstrap.bigdata.svc.cluster.local:9092
# (khớp đúng KAFKA_BROKER1 đã hardcode trong code).
# ============================================================================
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: bigdata
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        class: do-block-storage
        deleteClaim: false
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: kafka-cluster
  namespace: bigdata
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 3.9.2
    metadataVersion: 3.9-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      # Single broker => mọi replication factor = 1
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      message.max.bytes: 10485760          # 10MB - movie detail JSON khá lớn
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1"
        memory: "2Gi"
  entityOperator:
    topicOperator: {}
    userOperator: {}
