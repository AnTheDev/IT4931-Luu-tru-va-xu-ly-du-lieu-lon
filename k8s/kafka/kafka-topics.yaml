# ============================================================================
# Topics do Strimzi Topic Operator tự tạo trong cluster "kafka-cluster".
# ============================================================================
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: movie
  namespace: bigdata
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: "604800000"        # 7 ngày
    max.message.bytes: "10485760"    # 10MB
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: actor
  namespace: bigdata
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: "604800000"
    max.message.bytes: "10485760"
